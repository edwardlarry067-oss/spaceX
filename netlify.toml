[build]
  command = "cd artifacts && npm install -g pnpm 2>/dev/null; pnpm install --frozen-lockfile && pnpm --filter @workspace/spacex-starlink run build"
  publish = "artifacts/spacex-starlink/dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_URL = ""

[[redirects]]
  from = "/api/*"
  to = "https://orbitfuture--Orbitfuture.replit.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
